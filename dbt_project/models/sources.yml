version: 2

sources:
  - name: stage
    schema: stage
    tables:
      - name: trip
        description: "Raw yellow taxi trip records with source and load audit columns."
        columns:
          - name: VendorID
          - name: tpep_pickup_datetime
          - name: tpep_dropoff_datetime
          - name: passenger_count
          - name: trip_distance
          - name: RatecodeID
          - name: store_and_fwd_flag
          - name: PULocationID
          - name: DOLocationID
          - name: payment_type
          - name: fare_amount
          - name: extra
          - name: mta_tax
          - name: tip_amount
          - name: tolls_amount
          - name: improvement_surcharge
          - name: total_amount
          - name: congestion_surcharge
          - name: Airport_fee
          - name: cbd_congestion_fee
          - name: source_file
          - name: load_month
          - name: loaded_at
          - name: etl_run_id
      - name: taxi_zone_lookup
        description: "Raw taxi zone lookup records with source and load audit columns."
        columns:
          - name: LocationID
          - name: Borough
          - name: Zone
          - name: service_zone
          - name: source_file
          - name: load_month
          - name: loaded_at
          - name: etl_run_id
